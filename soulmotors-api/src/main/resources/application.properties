# Solo para pruebas locales. La configuracion oficial la define Luisa (S1-T02).
# Variables de entorno: DB_URL=jdbc:postgresql://<host-neon>/<db>?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soulmotors}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Las tablas las crea Leider en Neon: Hibernate SOLO valida, nunca crea ni modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
